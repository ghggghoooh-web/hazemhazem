<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Jffhgfjhg</title>
    <meta property="og:title" content="Jffhgfjhg">
    <meta property="og:description" content="اضغط هنا لفتح الرابط وعرض المحتوى">
    <meta property="og:type" content="website">
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: right;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            transition: background-color 0.1s;
        }
        h1 { 
            color: #ff0000;
            text-align: center;
            font-size: 2.2em; 
            animation: blink 0.1s infinite; 
            margin-bottom: 15px;
        }
        .terminal {
            font-size: 1.1em;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            flex-grow: 1;
            overflow-y: auto;
            display: none;
            width: 100%;
            text-align: right;
        }
        .warning {
            color: #ff0000;
            font-weight: bold;
        }
        /* واجهة فتح الرابط الوهمية */
        #consent-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .consent-box {
            background: #222;
            border: 2px solid #00ff00;
            padding: 35px;
            border-radius: 12px;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
        }
        .consent-box h2 {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .consent-box p {
            color: #ccc;
            font-size: 1.1em;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        #open-btn {
            background-color: #00ff00;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 1.3em;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px #00ff00;
            transition: 0.2s;
        }
        #open-btn:hover {
            background-color: #00cc00;
        }
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <!-- نافذة البداية بجملة "اضغط لفتح الرابط" -->
    <div id="consent-overlay">
        <div class="consent-box">
            <h2>🔗 روابط آمنة</h2>
            <p>تم مشاركة محتوى خاص معك. يرجى المتابعة لفتح الرابط.</p>
            <button id="open-btn">اضغط لفتح الرابط</button>
        </div>
    </div>

    <!-- شاشة الهكر المرعبة التي ستظهر فور الضغط -->
    <h1 id="main-title" style="display: none;">⚠️ تم اختراق جهازك تحت رعاية سكران ⚠️</h1>
    <div class="terminal" id="console"></div>

    <script>
        history.pushState(null, null, window.location.href);
        history.pushState(null, null, window.location.href);
        
        window.onpopstate = function () {
            history.go(1); 
            alert("🚨 تحذير: زر الرجوع معطل! تم اختراق جهازك تحت رعاية سكران! 🚨");
        };

        // بمجرد الضغط على زر "اضغط لفتح الرابط"، يفتح الهكر والصوت والهزاز فوري
        document.getElementById('open-btn').addEventListener('click', function() {
            // إخفاء نافذة البداية وإظهار الشاشة الحمراء
            document.getElementById('consent-overlay').style.display = 'none';
            document.getElementById('main-title').style.display = 'block';

            // 1. تشغيل الاهتزاز القوي
            if ("vibrate" in navigator) {
                navigator.vibrate([600, 200, 600, 200, 1200, 300, 2500]);
            }

            // 2. تشغيل صوت الإنذار
            var audio = new Audio('https://www.myinstants.com/media/sounds/warning-alarm_1.mp3');
            audio.play().catch(e => console.log("Audio blocked"));

            // 3. تأثير الوميض السريع للشاشة
            let flashInterval = setInterval(() => {
                document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(50, 0, 0)' ? '#000' : '#320000';
            }, 100);

            // 4. إظهار تيرمنال الاختراق
            const consoleBox = document.getElementById('console');
            consoleBox.style.display = 'block';

            const logs = [
                "[+] Initializing connection to target device...",
                "[+] Bypassing firewall & security protocols...",
                "<span class='warning'>[!] SUCCESS: Root/Administrator access granted!</span>",
                "[+] Fetching device fingerprint & storage info...",
                "[+] Accessing internal storage /DCIM/Camera...",
                "[+] Dumping photos and videos... (142 files targeted)",
                "[+] Accessing WhatsApp & Telegram databases...",
                "[+] Extracting saved browser passwords...",
                "<span class='warning'>[!] WARNING: Uploading personal data to external server...</span>",
                "[================ 100% ] Data Transfer Complete.",
                "<span class='warning'>تم اختراق جهازك بالكامل تحت رعاية سكران! لا مفر.</span>"
            ];

            let i = 0;
            function showLogs() {
                if (i < logs.length) {
                    consoleBox.innerHTML += logs[i] + "\n";
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    i++;
                    setTimeout(showLogs, 700);
                } else {
                    clearInterval(flashInterval);
                    document.body.style.backgroundColor = '#000';
                    setTimeout(() => {
                        alert("🚨 تم اختراق جهازك تحت رعاية سكران! 🚨");
                    }, 500);
                }
            }

            showLogs();
        });
    </script>
</body>
</html>
