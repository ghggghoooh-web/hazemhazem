<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تم اختراق جهازك تحت رعاية سكران</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: right;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        h1 { 
            color: #ff0000;
            text-align: center;
            font-size: 2.2em; 
            animation: blink 0.1s infinite; 
            margin-bottom: 15px;
        }
        .terminal {
            font-size: 1.1em;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            flex-grow: 1;
            overflow-y: auto;
            display: none;
        }
        .warning {
            color: #ff0000;
            font-weight: bold;
        }
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <h1 id="main-title">⚠️ تم اختراق جهازك تحت رعاية سكران ⚠️</h1>
    <p id="sub-text" style="color: #fff; text-align: center; font-size: 1.3em;">جاري فحص النظام وسحب الملفات الشخصية...</p>
    
    <div class="terminal" id="console"></div>

    <script>
        window.onload = function() {
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                history.pushState(null, null, location.href);
            };

            try {
                if (navigator.vibrate) {
                    setInterval(() => {
                        navigator.vibrate([1000, 500, 1000, 500]);
                    }, 1000);
                }
            } catch (e) {}

            setTimeout(() => {
                alert("🚨 تنبيه عاجل: تم اختراق جهازك تحت رعاية سكران! 🚨");
            }, 300);

            setTimeout(() => {
                document.getElementById('sub-text').style.display = 'none';
                const consoleBox = document.getElementById('console');
                consoleBox.style.display = 'block';

                const logs = [
                    "[+] Initializing connection to target device...",
                    "[+] Bypassing firewall & security protocols...",
                    "<span class='warning'>[!] SUCCESS: Root/Administrator access granted!</span>",
                    "[+] Fetching device fingerprint & storage info...",
                    "[+] Accessing internal storage /DCIM/Camera...",
                    "[+] Dumping photos and videos... (142 files targeted)",
                    "[+] Accessing WhatsApp & Telegram databases...",
                    "[+] Extracting saved browser passwords...",
                    "<span class='warning'>[!] WARNING: Uploading personal data to external server...</span>",
                    "[================ 100% ] Data Transfer Complete.",
                    "<span class='warning'>تم اختراق جهازك بالكامل تحت رعاية سكران! لا مفر.</span>"
                ];

                let i = 0;
                function showLogs() {
                    if (i < logs.length) {
                        consoleBox.innerHTML += logs[i] + "\n";
                        consoleBox.scrollTop = consoleBox.scrollHeight;
                        i++;
                        setTimeout(showLogs, 700);
                    } else {
                        setTimeout(() => {
                            alert("🚨 تم اختراق جهازك تحت رعاية سكران! 🚨");
                        }, 500);
                    }
                }

                showLogs();
            }, 1500);
        };
    </script>
</body>
</html>
