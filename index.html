<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: right;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            position: fixed;
            top: 0;

            width: 100%;

        h1 {

        .terminal {

            position: relative;
            z-index: 2;
            display: none;
            height: 75vh;
            overflow-y: auto;
        }
        .warning {
            color: #ff0000;
            font-weight: bold;
        }
        #consent-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .consent-box {
            background: #222;
            border: 2px solid #00ff00;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        #open-btn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
        }
        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div id="consent-overlay">
        <div class="consent-box">
            <h2 style="color:#fff;">🔗 روابط آمنة</h2>
            <p style="color:#ccc;">اضغط لفتح الرابط وعرض المحتوى.</p>
            <button id="open-btn">اضغط لفتح الرابط</button>
        </div>
    </div>

    <canvas id="matrix"></canvas>
    <h1 id="main-title">⚠️ تم اختراق جهازك تحت رعاية سكران ⚠️</h1>
    <div class="terminal" id="console"></div>

    <script>
        history.pushState(null, null, window.location.href);
        history.pushState(null, null, window.location.href);
        window.onpopstate = function () { 
            history.go(1); 
            alert("🚨 زر الرجوع معطل! تم اختراق جهازك تحت رعاية سكران! 🚨"); 
        };

        document.getElementById('open-btn').addEventListener('click', function() {
            document.getElementById('consent-overlaystyle', '').style.display = 'none';
            document.getElementById('consent-overlay').style.display = 'none';
            document.getElementById('main-title').style.display = 'block';
            
            const canvas = document.getElementById('matrix');
            canvas.style.display = 'block';
            
            // تأثير رموز الماتريكس المتساقطة
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = "0101010101HAZEMSYSTEMSECURECRASHROOTSQL";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = [];
            for (let x = 0; x < columns; x++) drops[x] = 1;
            
            function drawMatrix() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f0';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(drawMatrix, 33);

            if ("vibrate" in navigator) { 
                navigator.vibrate([600, 200, 600, 200, 1200, 300, 2500]); 
            }
            var audio = new Audio('https://www.myinstants.com/media/sounds/warning-alarm_1.mp3');
            audio.play().catch(e => console.log("Audio blocked"));

            const consoleBox = document.getElementById('console');
            consoleBox.style.display = 'block';

            const logs = [
                "[+] Initializing connection to target device...",
                "[+] Bypassing firewall & security protocols...",
                "<span class='warning'>[!] SUCCESS: Root/Administrator access granted!</span>",
                "[+] Injecting payload into system kernel...",
                "[+] Accessing internal storage /DCIM/Camera...",
                "[+] Dumping photos and videos... (142 files targeted)",
                "[+] Accessing WhatsApp & Telegram databases...",
                "[+] Extracting saved browser passwords...",
                "<span class='warning'>[!] WARNING: Uploading personal data to external server...</span>",
                "[================ 100% ] Data Transfer Complete.",
                "<span class='warning'>تم اختراق جهازك بالكامل تحت رعاية سكران! لا مفر.</span>"
            ];

            let i = 0;
            function showLogs() {
                if (i < logs.length) {
                    consoleBox.innerHTML += logs[i] + "\n";
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    i++;
                    setTimeout(showLogs, 700);
                } else {
                    setTimeout(() => { 
                        alert("🚨 تم اختراق جهازك بالكامل تحت رعاية سكران! 🚨"); 
                    }, 500);
                }
            }
            showLogs();
        });
    </script>
</body>
</html>
