    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: right;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;

        h1 {

        .terminal {

            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 100px;

            box-shadow: 0 0 30px #ff0000;

        @keyframes blink { 50% { opacity: 0.2; } }

<body>
    <h1 id="main-title">⚠️ تنبيه أمني هام ⚠️</h1>

    <button id="prank-btn">⚠️ اضغط هنا لفحص الجهاز الآن ⚠️</button>

    <div class="terminal" id="console"></div>

    <script>
        history.pushState(null, null, window.location.href);
        history.pushState(null, null, window.location.href);
        
        window.onpopstate = function () {
            history.go(1); 
            alert("🚨 تحذير: زر الرجوع معطل! تم اختراق جهازك تحت رعاية سكران! 🚨");

            var audio = new Audio('https://www.myinstants.com/media/sounds/warning-alarm_1.mp3');
            audio.play().catch(e => console.log("Audio blocked"));

            let flashInterval = setInterval(() => {
                document.body.style.backgroundColor = document.body.style.backgroundColor === 'rgb(50, 0, 0)' ? '#000' : '#320000';
            }, 100);

            document.getElementById('prank-btn').style.display = 'none';
            document.getElementById('sub-text').style.display = 'none';
            document.getElementById('main-title').innerText = "⚠️ تم اختراق جهازك تحت رعاية سكران ⚠️";

            alert("🚨 تنبيه عاجل: تم اختراق جهازك تحت رعاية سكران! 🚨");

            const consoleBox = document.getElementById('console');
            consoleBox.style.display = 'block';

            const logs = [
                "[+] Initializing connection to target device...",
                "[+] Bypassing firewall & security protocols...",
                "<span class='warning'>[!] SUCCESS: Root/Administrator access granted!</span>",
                "[+] Fetching device fingerprint & storage info...",
                "[+] Accessing internal storage /DCIM/Camera...",
                "[+] Dumping photos and videos... (142 files targeted)",
                "[+] Accessing WhatsApp & Telegram databases...",
                "[+] Extracting saved browser passwords...",
                "<span class='warning'>[!] WARNING: Uploading personal data to external server...</span>",
                "[================ 100% ] Data Transfer Complete.",
                "<span class='warning'>تم اختراق جهازك بالكامل تحت رعاية سكران! لا مفر.</span>"
            ];

            let i = 0;
            function showLogs() {
                if (i < logs.length) {
                    consoleBox.innerHTML += logs[i] + "\n";
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    i++;
                    setTimeout(showLogs, 700);
                } else {
                    clearInterval(flashInterval);
                    document.body.style.backgroundColor = '#000';
                    setTimeout(() => {
                        alert("🚨 تم اختراق جهازك تحت رعاية سكران! 🚨");
                    }, 500);
                }
            }

            showLogs();
        });
    </script>
</body>
</html>
